###
# app configuration
###

[app:main]
use = egg:products_api

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_tm

# URL database dibaca dari file .env oleh products_api (lihat get_database_url).
# Nilai di bawah ini hanya cadangan apabila .env tidak ditemukan.
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/products_api_db

###
# wsgi server configuration
###

[server:main]
use = egg:waitress#main
listen = 0.0.0.0:6543

###
# logging configuration
###

[loggers]
keys = root, products_api, sqlalchemy, waitress, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_products_api]
level = DEBUG
handlers =
qualifiers =
qualname = products_api

[logger_sqlalchemy]
level = INFO
handlers =
qualifiers =
qualname = sqlalchemy

[logger_waitress]
level = INFO
handlers =
qualifiers =
qualname = waitress

[logger_alembic]
level = INFO
handlers =
qualifiers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

[alembic]
script_location = products_api/alembic
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/products_api_db
