[app:main]
use = egg:products_api

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en
pyramid.includes =
    pyramid_tm

# Database in-memory khusus pengujian pytest (tidak memakai PostgreSQL).
sqlalchemy.url = sqlite:///:memory:

[server:main]
use = egg:waitress#main
listen = localhost:6543

[loggers]
keys = root, products_api, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_products_api]
level = DEBUG
handlers =
qualifiers =
qualname = products_api

[logger_sqlalchemy]
level = WARNING
handlers =
qualifiers =
qualname = sqlalchemy

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s

[alembic]
script_location = products_api/alembic
sqlalchemy.url = sqlite:///:memory:
